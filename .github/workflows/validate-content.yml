name: Inhalte prüfen
on:
  pull_request:
    paths: ["content/**", "scripts/validate-content.mjs"]
  push:
    branches: [main]
    paths: ["content/**", "scripts/validate-content.mjs"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/validate-content.mjs
